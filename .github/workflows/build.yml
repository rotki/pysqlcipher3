name: Build wheels

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-**"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request:

permissions: {}

env:
  SQLCIPHER3_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml

  sdist:
    name: Build source distribution
    needs: tests
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.tests.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: false
          version: "0.11.27"

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/sqlcipher3*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build ${{ matrix.out }} wheels
    needs: tests
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.tests.result == 'success') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cibw_archs: x86_64
            cibw_build: "cp314-manylinux_* cp314t-manylinux_*"
            cibw_skip: ""
            compile_target: x86_64
            out: x86_64-manylinux
          - os: ubuntu-24.04-arm
            cibw_archs: aarch64
            cibw_build: "cp314-manylinux_* cp314t-manylinux_*"
            cibw_skip: ""
            compile_target: armv8
            out: armv8-manylinux
          - os: windows-latest
            cibw_archs: AMD64
            cibw_build: "cp314-* cp314t-*"
            cibw_skip: ""
            compile_target: x86_64
            out: x86_64-windows
          - os: macos-15-intel
            cibw_archs: x86_64
            cibw_build: "cp314-* cp314t-*"
            cibw_skip: ""
            compile_target: x86_64
            out: x86_64-macos
          - os: macos-15
            cibw_archs: arm64
            cibw_build: "cp314-* cp314t-*"
            cibw_skip: ""
            compile_target: armv8
            out: armv8-macos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Build wheels for ${{ matrix.os }} ${{ matrix.cibw_archs }} ${{ matrix.cibw_build }}
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: ${{ matrix.cibw_skip }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT: >
            SQLCIPHER3_COMPILE_TARGET=${{ matrix.compile_target }}
            SQLCIPHER3_VERSION=${{ env.SQLCIPHER3_VERSION }}
          CIBW_BEFORE_ALL_LINUX: command -v yum >/dev/null && yum -y install perl-core || command -v apk >/dev/null && apk add perl || true
          CIBW_TEST_COMMAND: python {project}/tests/wheel_smoke.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.out }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish to TestPyPI
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.sdist.result == 'success' &&
        needs.wheels.result == 'success'
      }}
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write  # needed for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    if: >-
      ${{
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.sdist.result == 'success' &&
        needs.wheels.result == 'success'
      }}
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # needed for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
